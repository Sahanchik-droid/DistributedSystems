version: '3'

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    ports:
      - "5000:5000"
    environment:
      - SECONDARIES=http://secondary1:5001,http://secondary2:5001,http://secondary3:5001
    networks:
      - replicated-log-network

  secondary1:
    build:
      context: .
      dockerfile: Dockerfile.secondary
    ports:
      - "5001:5001"
    environment:
      - REPLICATION_DELAY=1
    networks:
      - replicated-log-network

  secondary2:
    build:
      context: .
      dockerfile: Dockerfile.secondary
    ports:
      - "5002:5001"
    environment:
      - REPLICATION_DELAY=3
    networks:
      - replicated-log-network

  secondary3:
    build:
      context: .
      dockerfile: Dockerfile.secondary
    ports:
      - "5003:5001"
    environment:
      - REPLICATION_DELAY=5
    networks:
      - replicated-log-network

networks:
  replicated-log-network:
    driver: bridge
