version: '3'

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - IS_MASTER=true
      - PORT=5000
      - SECONDARY_URLS=http://secondary1:5001,http://secondary2:5002
    networks:
      - message-network

  secondary1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - IS_MASTER=false
      - PORT=5001
      - MASTER_URL=http://master:5000
      - REPLICATION_DELAY=5
    networks:
      - message-network
    depends_on:
      - master

  secondary2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - IS_MASTER=false
      - PORT=5002
      - MASTER_URL=http://master:5000
      - REPLICATION_DELAY=8
    networks:
      - message-network
    depends_on:
      - master

networks:
  message-network:
    driver: bridge
